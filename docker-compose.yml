name: anime-classifier

x-postgres-credentials: &postgres-credentials
    POSTGRES_USER: ${POSTGRES_USER:- postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:- postgres}

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    environment:
      <<: *postgres-credentials
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD}
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@anime-classifier-postgres-1:${POSTGRES_PORT}/mlflow_db
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/mlartifacts
      MLFLOW_HOST: 0.0.0.0
    
    # pip install psycopg2-binary
    command: 
    - /bin/sh
    - -c
    - |
      pip install psycopg2-binary --quiet
      mlflow server
    
    restart: always
    depends_on:
      - postgres
    ports:
      - 5000:5000
    volumes:
      - mlflow-data:/mlflow

  postgres:
    image: postgres:latest
    environment:
      <<: *postgres-credentials
      POSTGRES_DB: ${POSTGRES_DB:- anime_classifier}

    command: 
    - /bin/sh
    - -c
    - |
      echo 'CREATE DATABASE mlflow_db;' > /docker-entrypoint-initdb.d/init.sql
      docker-entrypoint.sh postgres
      wait

    restart: always
    ports:
      - 5432:${POSTGRES_PORT:- 5432}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mlflow-data:
  postgres-data: